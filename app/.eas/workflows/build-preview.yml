# main을 build-preview 브랜치로 푸시하면 테스트용 APK (git push -f origin main:build-preview)
# 네이티브 fingerprint가 같은 빌드가 이미 있으면 빌드하지 않고 JS만 업데이트(OTA)로 보냄
# expo.dev에서 GitHub 레포 연결 + 기본 디렉터리 "app" 설정이 되어 있어야 동작
name: Build preview APK

on:
  push:
    branches: ['build-preview']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview
  get_android_build:
    name: Check existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      platform: android
      profile: preview
  build_android:
    name: Build Android (preview)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
  update:
    name: Publish update (preview)
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
